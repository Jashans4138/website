<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUTFIX - Dress Collection</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>OUTFIX</h1>
            <div class="header-nav">
                <a href="index.html">Home</a>
                <a href="collection.html" class="active">Collection</a>
                <a href="about.html">About Us</a>
                <a href="account.html">My Account</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="collection-header">
            <h2>Our Complete Collection</h2>
            <div class="filter-controls">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="casual">Casual Wear</option>
                    <option value="formal">Formal Attire</option>
                    <option value="party">Party Wear</option>
                    <option value="summer">Summer Collection</option>
                    <option value="winter">Winter Specials</option>
                </select>
                <select id="priceFilter">
                    <option value="all">All Prices</option>
                    <option value="0-50">Under $50</option>
                    <option value="50-100">$50 - $100</option>
                    <option value="100-200">$100 - $200</option>
                </select>
                <select id="sortBy">
                    <option value="featured">Featured</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="newest">Newest Arrivals</option>
                </select>
            </div>
        </section>

        <section class="product-collection">
            <div class="product-grid" id="collectionProducts">
                <!-- Products will be loaded here dynamically by script.js -->
            </div>
        </section>

        <div class="pagination">
            <button class="page-btn active">1</button>
            <span>...</span>
            <button class="page-btn">2</button>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Categories</h3>
                <ul>
                    <li><a href="collection.html?category=casual">Casual Wear</a></li>
                    <li><a href="collection.html?category=formal">Formal Attire</a></li>
                    <li><a href="collection.html?category=party">Party Wear</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Help</h3>
                <ul>
                    <li><a href="#">Size Guide</a></li>
                    <li><a href="#">Shipping Info</a></li>
                    <li><a href="#">Returns</a></li>
                </ul>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2025 OUTFIX. A project by Jashan & Avneet.</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
    
    
</body>
</html>
